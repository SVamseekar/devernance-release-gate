name: Devernance release gate
description: Fail the job when an AI system's release gate is BLOCKED (or REVIEW), using evidence tracked in Devernance.
author: Devernance
branding:
  icon: shield
  color: blue
inputs:
  api-key:
    description: Devernance API key (store it as a secret)
    required: true
  system-id:
    description: The AI system id from Devernance
    required: true
  api-url:
    description: Base URL of your Devernance workspace, for example https://app.example.com
    required: true
  fail-on:
    description: "blocked (default) or review"
    required: false
    default: blocked
  evgraph-scan:
    description: >-
      Optional. Three space-separated paths (model card, approval record, deployment record) to check with
      `evgraph scan-promotion --gate` in addition to the release gate.
    required: false
    default: ""
  evgraph-version:
    description: evgraph-cli version used for evgraph-scan
    required: false
    default: "0.1.3"
outputs:
  decision:
    description: PASS, REVIEW, or BLOCKED
    value: ${{ steps.gate.outputs.decision }}
  blockers:
    description: JSON array of blocker strings
    value: ${{ steps.gate.outputs.blockers }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GATE_API_KEY: ${{ inputs.api-key }}
        GATE_SYSTEM_ID: ${{ inputs.system-id }}
        GATE_API_URL: ${{ inputs.api-url }}
        GATE_FAIL_ON: ${{ inputs.fail-on }}
      run: bash "$GITHUB_ACTION_PATH/scripts/gate.sh"
    - id: evgraph
      if: ${{ always() && inputs.evgraph-scan != '' }}
      shell: bash
      env:
        EVGRAPH_SCAN: ${{ inputs.evgraph-scan }}
        EVGRAPH_VERSION: ${{ inputs.evgraph-version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/evgraph.sh"
